<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4efe7">
  <title>Мое расписание</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>Расписание</span></div>
    </header>

    <nav class="day-picker" aria-label="Выбор дня недели" id="dayPicker"></nav>

    <section class="schedule-head">
      <h1 id="selectedDay">Понедельник</h1>
    </section>

    <section class="schedule" id="schedule" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
